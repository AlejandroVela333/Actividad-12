<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Vue 2 application that displays five Chuck Norris jokes.">
  <title>Chuck Norris Jokes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" v-cloak>
    <section class="jokes-panel" aria-labelledby="page-title">
      <header class="page-header">
        <p class="eyebrow">Activity 12 · Vue 2</p>
        <h1 id="page-title">Chuck Norris Jokes</h1>
        <p class="intro">Five legendary facts rendered declaratively with Vue.</p>
      </header>

      <ol class="jokes-list">
        <li v-for="(joke, index) in chuck" :key="index" class="joke-card">
          <span class="joke-number" aria-hidden="true">{{ index + 1 }}</span>
          <p>{{ joke.value }}</p>
        </li>
      </ol>

      <footer class="page-footer">
        <span>{{ chuck.length }} jokes</span>
        <span>Rendered with v-for</span>
      </footer>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
  <script src="main.js"></script>
</body>
</html>
